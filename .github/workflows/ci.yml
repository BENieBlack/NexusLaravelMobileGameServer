name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 静的解析とフォーマットはDB不要なので分離して速く回す
  static-analysis:
    name: 静的解析・フォーマット
    runs-on: ubuntu-latest
    # 通常は1分程度。キャッシュが効かないcomposer installを見込んでも十分な上限
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: PHPのセットアップ
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, redis, bcmath, zip
          coverage: none

      # vendor ではなく Composer のダウンロードキャッシュを持つ。vendor を前方一致で復元すると、
      # 別の lock 時代の vendor から composer install がパッケージを削除し、その途中で
      # Laravel の prePackageUninstall スクリプトが消えたファイルを読んで落ちる
      - name: Composerのダウンロードキャッシュの場所
        id: composer-cache
        run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Composerキャッシュの復元
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-dl-api-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-dl-api-

      # composer install の package:discover が routes/channels.php を読み、Reverb の設定（REVERB_APP_KEY など）を
      # 要求する。.env が無いと null で落ちるので、install より前に用意する
      - name: .envの準備
        run: cp .env.example .env

      - name: 依存関係のインストール
        working-directory: api
        run: composer install --no-interaction --prefer-dist --no-progress

      # 既知の脆弱性がある依存を入れたままにしない。新しい勧告が出るとコードを変えなくても落ちるので、
      # 落ちたら composer update で上げる（2026-11-03 の評価 N3）
      - name: 依存パッケージの脆弱性の検査
        working-directory: api
        run: composer audit --no-interaction

      # 引数なしのpintはカレントディレクトリしか見ない。
      # packages/ はコード行数の約4割を占めるため、明示的に渡す
      - name: コードフォーマットの検証
        working-directory: api
        run: ./vendor/bin/pint --test

      - name: コードフォーマットの検証（packages）
        working-directory: api
        run: ./vendor/bin/pint --test ../packages

      - name: 静的解析
        working-directory: api
        run: ./vendor/bin/phpstan analyse --memory-limit=2G --no-progress

  # tool は api とは別のLaravelアプリで、composerの依存も分かれている。
  # api側のジョブから見えないため、専用のジョブで同じ3種類の検査を回す
  # パッケージを1つずつ単体で入れて、全クラスが読み込めるか確かめる。
  # api/ の vendor には全部入っているので、composer.json の宣言漏れ（laravel/framework など）に気づけない
  packages-standalone:
    name: パッケージ単体
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: PHPのセットアップ
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, redis, bcmath, zip
          coverage: none

      - name: パッケージ単体の検査
        run: bash scripts/check-packages-standalone.sh

  tool:
    name: ツール（tool）
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # tool のテストは admin / sys / trx の接続を使う。
    # 本番では別々のDBだが、テストでは1台のMySQLに3つのデータベースを作って足りる
    services:
      mysql:
        image: mysql:26.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nexus-testing-admin
        ports: ['33070:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10

    env:
      DB_ADMIN_HOST: 127.0.0.1
      DB_ADMIN_PORT: 33070
      DB_ADMIN_DATABASE: nexus-testing-admin
      DB_SYSTEM_HOST: 127.0.0.1
      DB_SYSTEM_PORT: 33070
      DB_SYSTEM_DATABASE: nexus-testing-system
      # tool/phpunit.xml でシャード数を2に固定している。2シャードとも同じデータベースへ向ける
      DB_SHARD1_HOST: 127.0.0.1
      DB_SHARD1_PORT: 33070
      DB_SHARD2_HOST: 127.0.0.1
      DB_SHARD2_PORT: 33070
      DB_SHARD_DATABASE: nexus-testing-shard

    steps:
      - uses: actions/checkout@v7

      - name: PHPのセットアップ
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, redis, bcmath, zip
          coverage: none

      # vendor ではなく Composer のダウンロードキャッシュを持つ。vendor を前方一致で復元すると、
      # 別の lock 時代の vendor から composer install がパッケージを削除し、その途中で
      # Laravel の prePackageUninstall スクリプトが消えたファイルを読んで落ちる
      - name: Composerのダウンロードキャッシュの場所
        id: composer-cache
        run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Composerキャッシュの復元
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-dl-tool-${{ hashFiles('tool/composer.lock') }}
          restore-keys: composer-dl-tool-

      - name: 依存関係のインストール
        working-directory: tool
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: 依存パッケージの脆弱性の検査
        working-directory: tool
        run: composer audit --no-interaction

      # tool は環境変数をリポジトリ直下の .env から読む
      - name: .envの準備
        run: cp .env.example .env

      - name: アプリケーションキーの生成
        working-directory: tool
        run: php artisan key:generate

      - name: コードフォーマットの検証
        working-directory: tool
        run: ./vendor/bin/pint --test

      - name: 静的解析
        working-directory: tool
        run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: テスト用データベースの作成
        run: >-
          mysql -h 127.0.0.1 -P 33070 -uroot -proot
          -e "CREATE DATABASE IF NOT EXISTS \`nexus-testing-system\`; CREATE DATABASE IF NOT EXISTS \`nexus-testing-shard\`;"

      - name: テスト
        working-directory: tool
        run: ./vendor/bin/phpunit

  test:
    name: テスト
    runs-on: ubuntu-latest
    # 通常は3分程度。ロック待ちなどで止まったときに、何時間も走らせないための上限
    timeout-minutes: 20

    # trx/log はシャーディングしているため、シャード数（2）ぶんのDBを立てる
    services:
      mysql-sys:
        image: mysql:26.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nexus-testing-system
        ports: ['33062:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
      mysql-mst:
        image: mysql:26.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nexus-testing-master
        ports: ['33063:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
      mysql-trx1:
        image: mysql:26.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nexus-testing-shard
        ports: ['33161:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
      mysql-trx2:
        image: mysql:26.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nexus-testing-shard
        ports: ['33162:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:8.4
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=10

    env:
      # CIのサービスコンテナはlocalhost経由で見えるため、
      # phpunit.xmlのDocker用ホスト名を上書きする
      DB_SHARD_COUNT: 2
      DB_SYSTEM_HOST: 127.0.0.1
      DB_SYSTEM_PORT: 33062
      DB_MASTER_HOST: 127.0.0.1
      DB_MASTER_PORT: 33063
      # api の config/database.php は trx{N} のホストを DB_SHARD{N}_HOST から読む。
      # log_* は trx と同じシャードに入るので、ログ専用の接続は無い
      DB_SHARD1_HOST: 127.0.0.1
      DB_SHARD1_PORT: 33161
      DB_SHARD2_HOST: 127.0.0.1
      DB_SHARD2_PORT: 33162
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v7

      - name: PHPのセットアップ
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, redis, bcmath, zip
          # カバレッジ計測。pcov.directoryを絞らないとpackagesが計測対象から外れる
          coverage: pcov
          ini-values: pcov.directory=${{ github.workspace }}, memory_limit=512M

      # vendor ではなく Composer のダウンロードキャッシュを持つ。vendor を前方一致で復元すると、
      # 別の lock 時代の vendor から composer install がパッケージを削除し、その途中で
      # Laravel の prePackageUninstall スクリプトが消えたファイルを読んで落ちる
      - name: Composerのダウンロードキャッシュの場所
        id: composer-cache
        run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Composerキャッシュの復元
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-dl-api-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-dl-api-

      # composer install の package:discover が routes/channels.php を読み、Reverb の設定（REVERB_APP_KEY など）を
      # 要求する。.env が無いと null で落ちるので、install より前に用意する
      - name: .envの準備
        run: cp .env.example .env

      - name: 依存関係のインストール
        working-directory: api
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: アプリケーションキーの生成
        working-directory: api
        run: php artisan key:generate

      # phpunit.xml の Unit / Feature / Packages を全て実行する
      # （Packages は ../packages/*/tests を対象にしている）
      # カバレッジは app と packages/*/src が対象。--min は現状値のすぐ下に置く。
      # 実測から離れた値にすると、下がってもCIが通ってしまい検知にならない
      - name: テスト（api + packages）
        working-directory: api
        run: php artisan test --coverage --min=90
