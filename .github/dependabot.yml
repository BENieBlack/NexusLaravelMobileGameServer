# 依存パッケージの更新PRを自動で作る（2026-11-03 の評価 N3）
#
# - composer は api と tool で依存が分かれているため、それぞれを見る
#   （packages/* は api から path リポジトリで読むので、api の更新に含まれる）
# - composer はメジャー更新も含めて、ディレクトリごとに1つのPRへまとめる。
#   PRを分けると、どれも同じ composer.lock を書き換える。別々にマージすると後のPRの lock が
#   先のPRの更新を含まず、composer.json と食い違って composer install が落ちる
#   （#130 と #131 で起きた）。1つのPRなら lock は常に1回の更新で作られる
version: 2
updates:
  - package-ecosystem: composer
    directory: /api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      all:
        patterns: ['*']
        update-types: [major, minor, patch]

  - package-ecosystem: composer
    directory: /tool
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      all:
        patterns: ['*']
        update-types: [major, minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /docker/api-php
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /docker/tool-php
    schedule:
      interval: monthly
