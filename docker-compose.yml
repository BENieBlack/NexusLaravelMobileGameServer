  redis:
    image: redis:8.4
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - local-network

networks:
  local-network:
    driver: bridge

volumes:
  db_mst_data:
  db_trx1_data:
  db_trx2_data:
  db_log1_data:
  db_log2_data:
  db_admin_data:
  db_sys_data:
  db_tool_data:
    driver: local
