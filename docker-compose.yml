services:
  api-php:
    build:
      context: ./docker/api-php
      dockerfile: Dockerfile
    container_name: api-php
    working_dir: /var/www/html
    volumes:
      - ./api:/var/www/html
      - ./packages:/var/www/packages
      - ./.env:/var/www/.env:ro  # Mount root .env as read-only
      # エージェント向けドキュメント（読み取り専用）。.opencodeは.claudeへのシンボリックリンク
      - ./.claude:/var/www/.claude:ro
    environment:
      # 既定値は設けない。未設定なら署名検証が起動時に失敗する（既知の鍵で通してしまうのを防ぐ）
      - CLIENT_SECRET=${CLIENT_SECRET}
      - DB_TRX_SHARDS=${DB_TRX_SHARDS:-2}
    networks:
      - local-network

  api-web:
    image: nginx:latest
    container_name: api-web
    ports:
      - "8090:80"
    volumes:
      - ./api:/var/www/html
      - ./docker/api-nginx/api-nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api-php
    networks:
      - local-network

  tool-php:
    build:
      context: ./docker/tool-php
      dockerfile: Dockerfile
    container_name: tool-php
    working_dir: /var/www/html
    volumes:
      - ./tool:/var/www/html
      - ./packages:/var/www/packages
      - ./.env:/var/www/.env:ro  # Mount root .env as read-only
    networks:
      - local-network

  tool-web:
    image: nginx:latest
    container_name: tool-web
    ports:
      - "8091:80"
    volumes:
      - ./tool:/var/www/html
      - ./docker/tool-nginx/tool-nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - tool-php
    networks:
      - local-network

  db-adm:
    image: mysql:latest
    container_name: db-adm
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      DB_NAMES: "${APP_NAME:-nexus}-${APP_ENV:-local}-adm"
    ports:
      - "63060:3306"
    volumes:
      - db_admin_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - local-network

  db-tol:
