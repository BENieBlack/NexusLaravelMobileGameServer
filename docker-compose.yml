services:
  api-php:
    build:
      context: ./docker/api-php
      dockerfile: Dockerfile
    container_name: api-php
    working_dir: /var/www/html
    volumes:
      - ./api:/var/www/html
      - ./packages:/var/www/packages
      - ./.env:/var/www/.env:ro  # Mount root .env as read-only
      # エージェント向けドキュメント（読み取り専用）。.opencodeは.claudeへのシンボリックリンク
      - ./.claude:/var/www/.claude:ro
    environment:
      # 既定値は設けない。未設定なら署名検証が起動時に失敗する（既知の鍵で通してしまうのを防ぐ）
      - CLIENT_SECRET=${CLIENT_SECRET}
      - DB_SHARD_COUNT=${DB_SHARD_COUNT:-2}
    networks:
      - local-network

  api-web:
    image: nginx:latest
    container_name: api-web
    ports:
      - "8090:80"
    volumes:
      - ./api:/var/www/html
      - ./docker/api-nginx/api-nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api-php
    networks:
      - local-network

  tool-php:
    build:
      context: ./docker/tool-php
      dockerfile: Dockerfile
    container_name: tool-php
    working_dir: /var/www/html
    volumes:
      - ./tool:/var/www/html
      - ./packages:/var/www/packages
      - ./.env:/var/www/.env:ro  # Mount root .env as read-only
    networks:
      - local-network

  tool-web:
    image: nginx:latest
    container_name: tool-web
    ports:
      - "8091:80"
    volumes:
      - ./tool:/var/www/html
      - ./docker/tool-nginx/tool-nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - tool-php
    networks:
      - local-network

  db-admin:
    image: mysql:latest
    container_name: db-admin
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      DB_NAMES: "${APP_NAME:-nexus}-${APP_ENV:-local}-admin"
    ports:
      - "63060:3306"
    volumes:
      - db_admin_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - local-network

  db-tool:
    image: mysql:latest
    container_name: db-tool
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      DB_NAMES: "${APP_NAME:-nexus}-${APP_ENV:-local}-tool"
    ports:
      - "63061:3306"
    volumes:
      - db_tool_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - local-network

  db-system:
    image: mysql:latest
    container_name: db-system
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      DB_NAMES: "${APP_NAME:-nexus}-${APP_ENV:-local}-system ${APP_NAME:-nexus}-testing-system"
    ports:
      - "63062:3306"
    volumes:
      - db_system_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - local-network

  db-master:
    image: mysql:latest
    container_name: db-master
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      DB_NAMES: "${APP_NAME:-nexus}-${APP_ENV:-local}-master ${APP_NAME:-nexus}-testing-master"
    ports:
      - "63063:3306"
    volumes:
      - db_master_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - local-network

  db-shard1:
    image: mysql:latest
    container_name: db-shard1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      DB_NAMES: "${APP_NAME:-nexus}-${APP_ENV:-local}-shard ${APP_NAME:-nexus}-testing-shard"
    ports:
      - "63161:3306"
    volumes:
      - db_shard1_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - local-network

  db-shard2:
    image: mysql:latest
    container_name: db-shard2
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      DB_NAMES: "${APP_NAME:-nexus}-${APP_ENV:-local}-shard ${APP_NAME:-nexus}-testing-shard"
    ports:
      - "63162:3306"
    volumes:
      - db_shard2_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - local-network

  db-shard3:
    image: mysql:latest
    container_name: db-shard3
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      DB_NAMES: "${APP_NAME:-nexus}-${APP_ENV:-local}-shard ${APP_NAME:-nexus}-testing-shard"
    ports:
      - "63163:3306"
    volumes:
      - db_shard3_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - local-network

  redis:
    image: redis:8.4
    container_name: redis
    ports:
      - "63790:6379"
    networks:
      - local-network

networks:
  local-network:
    driver: bridge

volumes:
  db_master_data:
  db_shard1_data:
  db_shard2_data:
  db_shard3_data:
  db_admin_data:
  db_system_data:
  db_tool_data:
    driver: local
